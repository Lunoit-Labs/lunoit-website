<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17251f"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="liq" gradientUnits="userSpaceOnUse" x1="170" y1="250" x2="350" y2="415">
      <stop offset="0" stop-color="#8ff0c0"/>
      <stop offset=".5" stop-color="#4cc38a"/>
      <stop offset="1" stop-color="#27a074"/>
    </linearGradient>
    <clipPath id="flask">
      <path d="M222,100 V210 C222,235 216,250 205,270 L150,365 C136,391 150,416 182,416 H330 C362,416 376,391 362,365 L307,270 C296,250 290,235 290,210 V100 Z"/>
    </clipPath>
    <clipPath id="body"><circle cx="256" cy="370" r="120"/></clipPath>
    <mask id="liquidMask">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="370" r="120" fill="#fff"/>
      <circle cx="290" cy="312" r="60" fill="#000"/>
    </mask>
  </defs>
  <rect width="1280" height="480" fill="#0d1015"/>
  <g transform="translate(50,30) scale(0.84)">
  <rect x="8" y="8" width="496" height="496" rx="44" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="44" fill="none" stroke="#4cc38a" stroke-opacity=".35" stroke-width="3"/>

  <!-- liquid: the water surface itself forms the crescent -->
  <g clip-path="url(#flask)">
    <rect width="512" height="512" fill="url(#liq)" mask="url(#liquidMask)"/>
    <g clip-path="url(#body)">
      <circle cx="290" cy="312" r="60" fill="none" stroke="#d9fff0" stroke-opacity=".55" stroke-width="4"/>
    </g>
    <circle cx="212" cy="384" r="6" fill="#d9fff0" fill-opacity=".6"/>
    <circle cx="318" cy="394" r="5" fill="#d9fff0" fill-opacity=".5"/>
    <circle cx="262" cy="398" r="4" fill="#d9fff0" fill-opacity=".45"/>
  </g>

  <!-- flask outline -->
  <g fill="none" stroke="#e8ecef" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <path d="M198,100 H314"/>
    <path d="M222,100 V210 C222,235 216,250 205,270 L150,365 C136,391 150,416 182,416 H330 C362,416 376,391 362,365 L307,270 C296,250 290,235 290,210 V100"/>
  </g>
  </g>
  <text x="520" y="268" font-family="Lora, Georgia, 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="170" fill="#4cc38a">lunoite</text>
  <line x1="530" y1="312" x2="590" y2="312" stroke="#4cc38a" stroke-width="4" stroke-linecap="round"/>
  <text x="530" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="42" letter-spacing="20" fill="#9aa4ad">LABS</text>
</svg>
